name: Terraform Validate

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-validate.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"

jobs:
  fmt-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform init (local backend)
        working-directory: terraform
        run: terraform init -input=false -backend=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

  plan:
    needs: fmt-validate
    if: vars.ENABLE_TERRAFORM_PLAN == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: ${{ secrets.PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || 'asia-northeast1' }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA_PLAN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform
        run: |
          BUCKET="${TF_STATE_BUCKET:-${PROJECT_ID}-tfstate}"
          terraform init -input=false \
            -backend-config="bucket=${BUCKET}" \
            -backend-config="prefix=tts-engine"

      - name: Terraform plan
        working-directory: terraform
        env:
          TF_VAR_project_id: ${{ env.PROJECT_ID }}
          TF_VAR_region: ${{ env.GCP_REGION }}
        run: terraform plan -input=false -no-color
