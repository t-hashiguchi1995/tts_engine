[project]
name = "tts-engine-workspace"
version = "0.1.0"
description = "Unified TTS API gateway for Piper-plus and Irodori-TTS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/tts_common",
    "packages/gateway",
    "packages/piper_service",
    "packages/irodori_service",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages"]

[tool.ruff]
line-length = 100
target-version = "py311"
