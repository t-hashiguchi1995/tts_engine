[project]
name = "tts-common"
version = "0.1.0"
description = "Shared schemas and HTTP utilities for tts_engine"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10",
    "httpx>=0.28",
    "google-auth>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_common"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
