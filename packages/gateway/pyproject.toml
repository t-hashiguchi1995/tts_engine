[project]
name = "tts-gateway"
version = "0.1.0"
description = "Unified TTS API gateway"
requires-python = ">=3.11"
dependencies = [
    "tts-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
    "httpx>=0.28",
    "google-auth>=2.0",
]

[project.optional-dependencies]
gcp = []

[tool.uv.sources]
tts-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]
