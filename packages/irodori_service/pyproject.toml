[project]
name = "tts-irodori-service"
version = "0.1.0"
description = "Irodori-TTS v2 GPU/CPU backend service"
requires-python = ">=3.11"
dependencies = [
    "tts-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
    "huggingface-hub>=0.34,<1.0",
    "torch>=2.5.0",
    "torchaudio>=2.5.0",
    "safetensors>=0.5.0",
    "soundfile>=0.12.0",
    "transformers<5",
    "sentencepiece>=0.1.99,<0.2",
    "pyyaml>=6.0",
    "peft>=0.18.0",
    "dacvae",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
tts-common = { workspace = true }
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
dacvae = { git = "https://github.com/facebookresearch/dacvae" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/irodori_service"]
