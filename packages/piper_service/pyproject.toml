[project]
name = "tts-piper-service"
version = "0.1.0"
description = "Piper-plus TTS backend service"
requires-python = ">=3.11"
dependencies = [
    "tts-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "piper-plus",
    "onnxruntime>=1.17",
    "soundfile>=0.12",
    "numpy>=1.26",
]

[tool.uv.sources]
tts-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piper_service"]
